version: '3.8'

services:
  pathmind-atlas:
    build: .
    container_name: pathmind-atlas
    ports:
      - "8000:8000"
    environment:
      - PATHMIND_HMAC_SECRET=${PATHMIND_HMAC_SECRET:-please-set-a-secure-32-char-min-secret-key}
      - PATHMIND_LLM_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
