name: PathMind Atlas CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PATHMIND_HMAC_SECRET: test-secret-key-for-ci-minimum-32-characters
      PATHMIND_LLM_PROVIDER: MOCK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents cli.py enrichment.py simulator.py tests
      - name: Check critical syntax and style errors
        run: ruff check --select E4,E7,E9 .
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("web/index.html").read_text(encoding="utf-8")
          script = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/pathmind-console.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/pathmind-console.js
      - name: Run tests
        run: python -m pytest -q
